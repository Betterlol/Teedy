# 对application.properties不支持！
# 1. 配置 H2 数据库为文件模式 (持久化元数据)
# 注意：URL 中的路径必须是绝对路径或相对于启动目录的有效路径
# spring.datasource.url=jdbc:h2:file:/home/YOUKNOWWHO/teedy_data/db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=admin
# spring.datasource.password=admin
#
# 2. 配置文件存储路径 (持久化文档实体)
# Teedy 通常使用 'teedy.datadir' 或类似的 key，如果不确定，可以尝试以下常见 key
# teedy.datadir=/home/YOUKNOWWHO/teedy_data/files
#
# 如果上面的 teedy.datadir 不生效，可能需要查看代码确认具体的 Key
# 有时候是 file-system.path 或 upload.directory
